name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip   # --group needs pip >= 25.1
          pip install --group dev

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

      - name: Check and unit-test the alert rules
        run: |
          docker run --rm -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/prometheus/rules:/etc/prometheus/rules:ro" \
            --entrypoint promtool prom/prometheus:v2.51.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/prometheus:/p:ro" \
            --entrypoint promtool prom/prometheus:v2.51.0 test rules /p/tests/alerts_test.yml
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Build Docker image
        run: docker build -t fraud-decision-engine .
