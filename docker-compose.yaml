services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Add up /metrics across the 8 uvicorn workers (see _metrics_app in app/main.py)
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraud
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/data/db_init/001_create_ip_country.sql:/docker-entrypoint-initdb.d/001_create_ip_country.sql:ro
      - ./app/data/db_init/002_load_ip_country.sql:/docker-entrypoint-initdb.d/002_load_ip_country.sql:ro
      - ./app/data/db_init/003_create_device_data.sql:/docker-entrypoint-initdb.d/003_create_device_data.sql:ro
      - ./app/data/db_init/004_create_transactions.sql:/docker-entrypoint-initdb.d/004_create_transactions.sql:ro
      - ./app/data/db_init/005_add_model_audit_columns.sql:/docker-entrypoint-initdb.d/005_add_model_audit_columns.sql:ro
      - ./app/data/db_init/006_add_transactions_user_index.sql:/docker-entrypoint-initdb.d/006_add_transactions_user_index.sql:ro
      - ./app/data/db_init/007_drop_unused_country_windows.sql:/docker-entrypoint-initdb.d/007_drop_unused_country_windows.sql:ro
      - ./app/data/IpAddress_to_Country.csv:/data/IpAddress_to_Country.csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
