global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Recording and alerting rules; what each alert means is in docs/monitoring.md.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fraud_engine
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics/
